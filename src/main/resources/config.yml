# ============================================================
#                   RewardHologram Config
# ============================================================

settings:
  debug: false
  # Cooldown in milliseconds between allowed clicks per player (prevents spam)
  click-cooldown-ms: 500
  # Default rendering engine: ARMOR_STAND or DISPLAY
  #   ARMOR_STAND — maximum compatibility (Java + Bedrock/Geyser)
  #   DISPLAY     — TextDisplay/ItemDisplay (1.19.4+): scale, glow, billboard,
  #                 per-line text sizes, advanced skull animations, smooth
  #                 pop-in/pop-out. On Bedrock (Geyser) support depends on
  #                 your Geyser version — use ARMOR_STAND if Bedrock matters.
  renderer: DISPLAY

holograms:

  daily_reward:
    # Renderer for THIS hologram: ARMOR_STAND, DISPLAY or DEFAULT (uses settings.renderer)
    renderer: DEFAULT

    chance: 30.0
    interval: 600
    despawn-after: 20

    offset:
      x: 0.0
      y: 1.5
      z: 2.5

    bobbing:
      enabled: true
      amplitude: 0.15
      speed: 0.05

    line-spacing: 0.28

    click-type: RIGHT

    # Hologram lines — supports & codes and hex &#RRGGBB.
    # Optional inline placeholder for per-line scale (DISPLAY renderer only):
    #   "{line_scale:1.2}your text here"
    # scale defaults to 1.0 when the placeholder is absent.
    # WARNING: quote the line when using the placeholder —
    # YAML treats a leading { as a mapping and would break the config.
    lines:
      - "{line_scale:1.2}&#FFD700&l✦ DAILY REWARD ✦"
      - "&eClick to &aclaim"
      - "{line_scale:0.9}&#00BFFF&7Double XP for 10 minutes"
      - "&bJust for you!"

    rewards:
      pick: -1
      list:
        - command: "give %player% diamond 3"
          chance: 100.0
        - command: "effect give %player% speed 600 1"
          chance: 50.0
        - command: "give %player% emerald 1"
          chance: 25.0

    appear-message: "&6&l[Reward] &eYou have a reward available! Look in front of you."
    claim-message: "&a&l[Reward] &fYou claimed your daily reward! &7Come back in 10 minutes."

    title:
      enabled: true
      title: "&6&l✦ REWARD ✦"
      subtitle: "&eA reward appeared in front of you"
      fade-in: 10
      stay: 60
      fade-out: 20

    sound:
      enabled: true
      name: "ENTITY_EXPERIENCE_ORB_PICKUP"
      volume: 1.0
      pitch: 1.2

    # ── DISPLAY-only options ──────────────────────────────────────────────
    display:
      # CENTER: always faces the player (like armor stand nametags)
      # VERTICAL / HORIZONTAL / FIXED also available
      billboard: CENTER
      # Global scale — multiplies every line and the skull
      scale: 1.0
      # Glow outline (color applied via scoreboard team)
      glow:
        enabled: false
        color: YELLOW    # WHITE, RED, GOLD, YELLOW, GREEN, AQUA, BLUE, LIGHT_PURPLE...
      text:
        # Drop shadow behind the characters
        shadowed: true
        # Whether the text is visible through walls
        see-through: false
        # TRANSPARENT (classic hologram look) or DEFAULT (semi-opaque panel)
        background: TRANSPARENT

    # Appear effects — animation is DISPLAY-only; particles work on both renderers
    appear:
      animation: POP        # NONE or POP (scale 0 -> 1, interpolated)
      duration-ticks: 6
      particles:
        enabled: true
        # Avoid particles that require data (DUST, ITEM, BLOCK...) — they are skipped
        type: TOTEM_OF_UNDYING
        count: 25
        spread: 0.5
        speed: 0.1

    # Despawn effects — POP animates scale down before removal (DISPLAY only)
    despawn:
      animation: POP
      duration-ticks: 6
      particles:
        enabled: true
        type: CLOUD
        count: 15
        spread: 0.4
        speed: 0.05

    skull:
      enabled: true
      texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjhkYzNjODQ0OTFjNGZmMTAzZGU2ZWEwMTg4MGUyZDgzNDMyY2Q0ODc4Yjg0ZDZiNDMyNTNjYzUxZmQ5NzhlNyJ9fX0="
      head-yaw: 0.0
      # DISPLAY: the skull is centered on its position — adjust this if it looks too high/low
      height-offset: 0.7
      # Size of the skull with DISPLAY (1.0 = item size; try 1.5-2.0 for a bigger look)
      scale: 1.0
      rotation:
        enabled: true
        speed: 2.0
      # Advanced skull animations — DISPLAY only
      effects:
        # Squash & stretch — the head squashes and stretches like a cartoon
        squash:
          enabled: true
          amplitude: 0.10   # How much it deforms (0.1 = subtle)
          speed: 0.15       # Oscillation speed
        # Slicon lateral tilt (left/right lean)
        tilt:
          enabled: true
          amplitude: 8.0    # Degrees
          speed: 0.06

    claim-sound:
      enabled: true
      name: "ENTITY_PLAYER_LEVELUP"
      volume: 1.0
      pitch: 1.5

  bonus_reward:
    renderer: DEFAULT
    chance: 10.0
    interval: 1800
    despawn-after: 15

    offset:
      x: 0.0
      y: 1.8
      z: 2.5

    bobbing:
      enabled: true
      amplitude: 0.20
      speed: 0.08

    line-spacing: 0.28
    click-type: BOTH

    lines:
      - "&#FF00FF&l★ SPECIAL BONUS ★"
      - "&fClick to claim"
      - "&#00FF7F&a+500 Coins"

    rewards:
      pick: 1
      list:
        - command: "eco give %player% 500"
          chance: 100.0
        - command: "eco give %player% 250"
          chance: 40.0
        - command: "broadcast &a%player% &fgot a special bonus!"
          chance: 100.0

    appear-message: "&d&l[Bonus] &fYou have a special bonus available!"
    claim-message: "&a&l[Bonus] &fYou claimed &a500 coins&f! Thanks for playing."

    title:
      enabled: true
      title: "&d&l★ SPECIAL BONUS ★"
      subtitle: "&fClick to claim 500 coins!"
      fade-in: 10
      stay: 60
      fade-out: 20

    sound:
      enabled: true
      name: "UI_TOAST_CHALLENGE_COMPLETE"
      volume: 1.0
      pitch: 1.0

    display:
      billboard: CENTER
      scale: 1.0
      glow:
        enabled: true
        color: LIGHT_PURPLE
      text:
        shadowed: false
        see-through: false
        background: TRANSPARENT

    appear:
      animation: POP
      duration-ticks: 8
      particles:
        enabled: true
        type: PORTAL
        count: 40
        spread: 0.7
        speed: 0.3

    despawn:
      animation: POP
      duration-ticks: 6
      particles:
        enabled: false
        type: CLOUD
        count: 15
        spread: 0.4
        speed: 0.05

    skull:
      enabled: true
      texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNWI4NWUyOWYyOWVjOWE5MGU0ODJlYTViODM5MWJjYjQ1NjBiYmFlMGRjZDE1ZDdjZTFkODYwMTZiNDM1NmU5OCJ9fX0="
      head-yaw: 45.0
      height-offset: 0.7
      scale: 1.2
      rotation:
        enabled: false
        speed: 3.0
      effects:
        squash:
          enabled: false
          amplitude: 0.12
          speed: 0.15
        tilt:
          enabled: false
          amplitude: 8.0
          speed: 0.06

    claim-sound:
      enabled: true
      name: "ENTITY_PLAYER_LEVELUP"
      volume: 1.0
      pitch: 1.0