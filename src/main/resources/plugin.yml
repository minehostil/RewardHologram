name: RewardHologram
version: '${project.version}'
main: dev.rewardhologram.RewardHologramPlugin
api-version: '1.21'
description: Per-player reward holograms with bobbing animation
authors: [Minehostil]

commands:
  rewardhologram:
    description: Manage RewardHologram plugin
    aliases: [rh, hologram]
    usage: /<command> <reload|list|spawn <id> <jugador>|remove <id> <player>>
    permission: rewardhologram.admin

permissions:
  rewardhologram.admin:
    description: Access to all RewardHologram commands
    default: op